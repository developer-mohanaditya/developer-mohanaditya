name: Update profile art

on:
  repository_dispatch:
    types: [refresh-profile-art]
  schedule:
    - cron: "0 11 * * *"
      timezone: "Asia/Kolkata"
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Fetch contribution data
        run: python scripts/fetch_contributions.py

      - name: Render heatmap
        run: python scripts/generate_streak_svg.py developer-mohanaditya contrib-heatmap.svg

      - name: Render stats card
        run: python scripts/render_stats_svg.py

      - name: Commit updated assets
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh profile art [skip ci]"
          file_pattern: "data/*.json contrib-heatmap.svg stats.svg"
          branch: main
